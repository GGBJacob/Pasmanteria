services:
    admin-mysql_db: # MariaDB container
        container_name: 'admin-mysql_db'
        image: mysql:5.7.41
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: 'student'
            MYSQL_DATABASE: 'BE_193186'
        volumes:
            - ./db:/var/lib/mysql
            # - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
        networks:
            - psnet
        platform: linux/x86_64 # Apple Silicon Macs only
    ps: # PrestaShop container
        container_name: ps
        #image: prestashop/prestashop:1.7.8
        build: .
        restart: unless-stopped
        environment:
            PS_DEV_MODE: 1
            DB_SERVER: admin-mysql_db
            DB_NAME: BE_193186
            DB_USER: root
            DB_PASSWD: student
            PS_INSTALL_AUTO: 0
        ports:
            # - 80:80   # HTTP
            - 19318:443 # HTTPS
        volumes:
            - ./src:/var/www/html
            - ./ssl:/etc/ssl/certs
            - ./config/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
        networks:
            - psnet
        depends_on:
            - admin-mysql_db
        # platform: linux/x86_64 # Apple Silicon Macs only
        command: /bin/bash -c "a2enmod ssl && apache2-foreground"
