name: Build and Push PrestaShop Docker Image

on:
  push:
    branches:
      - main
      - dev
      - 30-cicd

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build the PrestaShop Docker image
    - name: Build PrestaShop image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/prestashop:latest -f Dockerfile .

    # Push the image to Docker Hub
    - name: Push PrestaShop image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/prestashop:latest